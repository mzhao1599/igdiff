name: Bug report
description: Something in IgDiff doesn't work or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste cookies, tokens or anything copied from DevTools, and crop out usernames you'd rather not share.
  - type: input
    id: version
    attributes:
      label: IgDiff version
      description: Shown under IgDiff on chrome://extensions.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 141 on macOS"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Roughly how many accounts do you follow, or follow you?
      options:
        - Under 1,000
        - 1,000 to 10,000
        - Over 10,000
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any message IgDiff showed, word for word if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Open Instagram
        2. Click the IgDiff icon
        3. ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here.
